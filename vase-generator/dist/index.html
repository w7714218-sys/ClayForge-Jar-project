<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ClayForge</title>


  <script type="module" crossorigin src="/assets/index-BU_mRG7y.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-gY5SmKxY.css">
</head>

<body>

    <aside id="sidebar">

        <div class="logo">

            <h1>🏺 ClayForge</h1>

            <p>Parametric Vase Designer</p>

        </div>

        <div class="panel">

            <h3>Profile Editor</h3>

            <canvas id="profileCanvas"></canvas>

        </div>

        <div class="panel">

            <h3>Dimensions</h3>

            <div class="field">

                <label>Height</label>

                <input id="heightSlider" type="range" min="100" max="400" value="220">

                <span id="heightValue">220 mm</span>

            </div>

            <div class="field">

                <label>Wall Thickness</label>

                <input id="wallSlider" type="range" min="2" max="8" step="0.5" value="3">

                <span id="wallValue">3 mm</span>

            </div>

            <div class="field">

                <label>Resolution</label>

                <input id="segmentSlider" type="range" min="32" max="256" value="128">

                <span id="segmentValue">128</span>

            </div>

        </div>

        <div class="panel">

            <h3>Model Info</h3>

            <div class="info">

                <p>Height <span id="infoHeight">220 mm</span></p>

                <p>Diameter <span id="infoDiameter">100 mm</span></p>

                <p>Vertices <span id="infoVertices">0</span></p>

                <p>Status <span class="good">✔ Ready</span></p>

            </div>

        </div>

        <div class="panel">

            <button id="resetBtn">Reset Profile</button>

            <button id="randomBtn">Random Shape</button>

            <button id="exportBtn" disabled>Export STL (Soon)</button>

        </div>

    </aside>

    <main id="viewer">

        <canvas id="bg"></canvas>

    </main>


</body>

</html>
